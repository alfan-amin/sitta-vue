<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SITTA</title>

    <link rel="icon" type="image/png" href="assets/logo-ut.png">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-container">

        <img src="assets/logo-ut.png" alt="Logo UT">

        <h1>Login SITTA</h1>
        <p>Silakan login untuk masuk ke sistem</p>

        <form onsubmit="login(event)">

            <label>Username</label>
            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" id="user" placeholder="Masukkan username">
            </div>

            <label>Password</label>
            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="pass" placeholder="Masukkan password">
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="login-link">
            <a href="#" onclick="openModal('lupaPassword')">Lupa Password?</a>
            <a href="#" onclick="openModal('registrasi')">Registrasi</a>
        </div>

    </div>

    <div class="modal" id="lupaPassword">
        <div class="modal-content">
            <span class="close" onclick="closeModal('lupaPassword')">&times;</span>
            <h2>Lupa Password</h2>
            <p>Silakan hubungi Admin UT untuk reset password.</p>
        </div>
    </div>

    <div class="modal" id="registrasi">
        <div class="modal-content">
            <span class="close" onclick="closeModal('registrasi')">&times;</span>
            <h2>Registrasi Akun</h2>
            <p>Fitur registrasi belum tersedia. Silakan hubungi admin website.</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
