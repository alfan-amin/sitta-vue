<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stok Bahan Ajar</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>

<div id="app" class="container">

    <h1>Stok Bahan Ajar</h1>

    <!-- FILTER -->
    <div class="filter-box">

        <select v-model="filterUpbjj">
            <option value="">Semua UT Daerah</option>

            <option
                v-for="item in upbjjList"
                :key="item"
                :value="item">

                {{ item }}

            </option>
        </select>
        <select v-model="filterKategori">
            <option value="">Semua Kategori</option>

            <option
                v-for="item in kategoriFiltered"
                :key="item"
                :value="item">

                {{ item }}

            </option>
        </select>

        <select v-model="sortBy">
            <option value="">Sort Data</option>
            <option value="judul">Judul</option>
            <option value="qty">Stok</option>
            <option value="harga">Harga</option>
        </select>

        <label>
            <input type="checkbox" v-model="showMenipis">
            Stok Menipis
        </label>

        <label>
            <input type="checkbox" v-model="showKosong">
            Stok Kosong
        </label>

        <button @click="resetFilter">
            Reset
        </button>
        </div>

    <!-- FORM TAMBAH -->
    <div class="form-box">

        <h2>Tambah Bahan Ajar</h2>

        <input type="text" placeholder="Kode" v-model="form.kode">

        <input type="text" placeholder="Judul" v-model="form.judul">

        <select v-model="form.kategori">
            <option value="">Pilih Kategori</option>

            <option
                v-for="item in kategoriList"
                :key="item">

                {{ item }}

            </option>
        </select>

        <select v-model="form.upbjj">
            <option value="">Pilih UPBJJ</option>

            <option
                v-for="item in upbjjList"
                :key="item">

                {{ item }}

            </option>
        </select>
        <input type="text" placeholder="Lokasi Rak" v-model="form.lokasiRak">

        <input type="number" placeholder="Harga" v-model="form.harga">

        <input type="number" placeholder="Qty" v-model="form.qty">

        <input type="number" placeholder="Safety" v-model="form.safety">

        <textarea placeholder="Catatan" v-model="form.catatanHTML"></textarea>

        <button @click="tambahData">
            Tambah Data
        </button>

    </div>

    <!-- TABLE -->
    <table>

        <thead>
            <tr>
                <th>Kode</th>
                <th>Judul</th>
                <th>Kategori</th>
                <th>UPBJJ</th>
                <th>Lokasi Rak</th>
                <th>Harga</th>
                <th>Qty</th>
                <th>Safety</th>
                <th>Status</th>
                <th>Catatan</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>

            <tr v-for="(item,index) in stokFiltered" :key="item.kode">

                <td>{{ item.kode }}</td>
                <td>{{ item.judul }}</td>
                <td>{{ item.kategori }}</td>
                <td>{{ item.upbjj }}</td>
                <td>{{ item.lokasiRak }}</td>
                <td>{{ item.harga }}</td>
                <td>{{ item.qty }}</td>
                <td>{{ item.safety }}</td>

                <td>

                    <span
                        v-if="item.qty >= item.safety"
                        class="aman">

                        ✅ Aman

                    </span>

                    <span
                        v-else-if="item.qty > 0"
                        class="menipis">

                        ⚠️ Menipis

                    </span>
                    <span
                        v-else
                        class="kosong">

                        ❌ Kosong

                    </span>

                </td>

                <td v-html="item.catatanHTML"></td>

                <td>
                    <button @click="editData(index)">
                        Edit
                    </button>
                </td>

            </tr>

        </tbody>

    </table>

</div>

<script src="js/data-dummy.js"></script>
<script src="js/stok-app.js"></script>

</body>
</html>
